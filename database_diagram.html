<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Interactive Database Schema Template</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --page:#F7F0E3; --surface:#FFFCF8; --ink:#2B2118; --muted:#735E4C; --line:#DDCBB7; --soft:#F2E8DC;
  --edge:#A58D77; --focus:#8C5A34; --grid:#E6D8C8; --glass:rgba(255,252,248,.88); --shadow:0 10px 30px rgba(43,33,24,.16);
  
  /* Palette presets for up to 8 domain groups (light mode) */
  --c-1:#3E6B68; --t-1:rgba(62,107,104,.08);
  --c-2:#8C5A34; --t-2:rgba(140,90,52,.08);
  --c-3:#437241; --t-3:rgba(67,114,65,.08);
  --c-4:#B47A12; --t-4:rgba(180,122,18,.08);
  --c-5:#A8382B; --t-5:rgba(168,56,43,.08);
  --c-6:#544334; --t-6:rgba(84,67,52,.08);
  --c-7:#3B6E8C; --t-7:rgba(59,110,140,.08);
  --c-8:#6B4B82; --t-8:rgba(107,75,130,.08);

  --pk:#8A5A12; --pk-bg:#F7E7C6; --fk:#6B3E22; --fk-bg:#EEDDCB;
  --sans:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#1D1711; --surface:#261E16; --ink:#F3EAD9; --muted:#C2B29A; --line:#4A3C2C; --soft:#33261C;
    --edge:#A8927D; --focus:#D4A574; --grid:#2E2319; --glass:rgba(38,30,22,.88); --shadow:0 10px 30px rgba(0,0,0,.45);
    
    /* Dark mode domain group palettes */
    --c-1:#7FB0AC; --t-1:rgba(127,176,172,.09);
    --c-2:#D4A574; --t-2:rgba(212,165,116,.09);
    --c-3:#93BC8D; --t-3:rgba(147,188,141,.09);
    --c-4:#E2A93B; --t-4:rgba(226,169,59,.09);
    --c-5:#E0705F; --t-5:rgba(224,112,95,.09);
    --c-6:#C9B6A0; --t-6:rgba(201,182,160,.09);
    --c-7:#7FA8C9; --t-7:rgba(127,168,201,.09);
    --c-8:#B894D4; --t-8:rgba(184,148,212,.09);

    --pk:#E0B04A; --pk-bg:#3E3014; --fk:#D4A574; --fk-bg:#3E2C1E;
  }
}
:root[data-theme="dark"]{
  --page:#1D1711; --surface:#261E16; --ink:#F3EAD9; --muted:#C2B29A; --line:#4A3C2C; --soft:#33261C;
  --edge:#A8927D; --focus:#D4A574; --grid:#2E2319; --glass:rgba(38,30,22,.88); --shadow:0 10px 30px rgba(0,0,0,.45);
  --c-1:#7FB0AC; --t-1:rgba(127,176,172,.09);
  --c-2:#D4A574; --t-2:rgba(212,165,116,.09);
  --c-3:#93BC8D; --t-3:rgba(147,188,141,.09);
  --c-4:#E2A93B; --t-4:rgba(226,169,59,.09);
  --c-5:#E0705F; --t-5:rgba(224,112,95,.09);
  --c-6:#C9B6A0; --t-6:rgba(201,182,160,.09);
  --c-7:#7FA8C9; --t-7:rgba(127,168,201,.09);
  --c-8:#B894D4; --t-8:rgba(184,148,212,.09);
  --pk:#E0B04A; --pk-bg:#3E3014; --fk:#D4A574; --fk-bg:#3E2C1E;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;display:flex;flex-direction:column}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* Top Navigation Bar */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:14px 20px 12px}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:32px;height:32px;flex:none}
.brand h1{font-size:1.35rem;margin:0;letter-spacing:-0.01em;line-height:1.2}
.brand p{margin:2px 0 0;color:var(--muted);font-size:0.86rem}
.sp{flex:1}

.find{position:relative}
.find input{width:260px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px 8px 34px}
.find svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);pointer-events:none}
.results{position:absolute;top:calc(100% + 6px);left:0;width:320px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;z-index:30;display:none;max-height:320px;overflow:auto}
.results.open{display:block}
.results button{display:flex;align-items:center;gap:10px;width:100%;border:none;background:none;text-align:left;padding:7px 9px;border-radius:8px;cursor:pointer}
.results button:hover,.results button.act{background:var(--soft)}
.results i{width:8px;height:8px;border-radius:50%;background:var(--g);flex:none}
.results b{font-family:var(--mono);font-weight:500;font-size:0.86rem}
.results small{color:var(--muted);font-size:0.8rem;margin-left:auto}
.results .none{padding:8px 10px;color:var(--muted);font-size:0.88rem}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:none;background:none;border-radius:7px;padding:5px 11px;cursor:pointer;font-size:0.86rem;color:var(--muted);display:inline-flex;align-items:center;gap:7px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--page)}
.seg i{width:9px;height:9px;border-radius:3px;background:var(--g)}
.seg .lbl{padding:5px 6px 5px 8px;font-size:0.8rem;color:var(--muted);align-self:center}

.theme-btn{width:34px;height:34px;border:1px solid var(--line);border-radius:9px;background:var(--surface);display:grid;place-items:center;cursor:pointer}
.theme-btn:hover{background:var(--soft)}
.theme-btn svg{width:16px;height:16px}

/* Stage Canvas */
.stage{position:relative;flex:1;min-height:520px;margin:0 20px 20px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background-color:var(--surface);
  background-image:radial-gradient(var(--grid) 1.2px,transparent 1.2px);background-size:22px 22px;cursor:grab;touch-action:none;user-select:none}
.stage.panning{cursor:grabbing}
.world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}

.zone{position:absolute;border-radius:22px;background:var(--z);border:1px dashed color-mix(in srgb,var(--zc) 30%,transparent);transition:opacity .25s}
.zone b{position:absolute;left:20px;top:14px;font-size:1.15rem;color:var(--zc);font-weight:700}
.zone.dim{opacity:.22}

svg.edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.edge{pointer-events:auto;transition:opacity .25s}
.edge .ln{fill:none;stroke:var(--edge);stroke-width:1.6;transition:stroke .2s,stroke-width .2s}
.edge .hit{fill:none;stroke:transparent;stroke-width:16;cursor:pointer}
.edge .tag{pointer-events:none}
.edge .tag rect{fill:var(--surface);stroke:var(--line)}
.edge .tag text{font-family:var(--sans);font-size:13px;fill:var(--muted);font-weight:500;font-style:italic}
.edge .card-n{font-family:var(--sans);font-size:14px;font-weight:700;fill:var(--muted)}
.edge.hl .card-n,.edge:hover .card-n{fill:var(--ink)}
.edge.hl .tag text,.edge:hover .tag text{fill:var(--ink)}
.edge.hl .tag rect,.edge:hover .tag rect{stroke:var(--ink)}
.edge:hover .ln{stroke:var(--ink)}
.edge.hl .ln{stroke:var(--ink);stroke-width:2.3;stroke-dasharray:8 6;animation:flow 1s linear infinite}
.edge.hl.rev .ln{animation-name:flowrev}
.edge.dim{opacity:.08}
@keyframes flow{to{stroke-dashoffset:-14}}
@keyframes flowrev{to{stroke-dashoffset:14}}

/* Table Cards */
.card{position:absolute;width:300px;background:var(--surface);border:1px solid var(--line);border-radius:10px;cursor:pointer;overflow:hidden;
  transition:opacity .25s,box-shadow .2s;box-shadow:0 1px 2px rgba(43,33,24,.08)}
.card:hover{box-shadow:0 6px 18px rgba(43,33,24,.16)}
.card .hd{height:46px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 10px 0 12px;background:var(--g);color:#FFF8F0}
.card .nm{font-family:var(--mono);font-weight:500;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .st{font-size:11.5px;font-weight:600;border:1px solid rgba(255,248,240,.55);border-radius:5px;padding:0 5px;letter-spacing:.02em;flex:none}
.card ul{list-style:none;margin:0;padding:5px 0}
.card li{height:28px;display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:6px;padding:0 12px 0 10px;font-size:14px}
.card li .cn{font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card li .ct{color:var(--muted);font-size:12.5px;white-space:nowrap}
.card li.pk .cn{font-weight:500;text-decoration:underline;text-underline-offset:2px}
.card li.fk .cn{font-style:italic}
.card li.lit{background:var(--soft)}
.card li .k{justify-self:start}
.card.dim{opacity:.18}
.card.sel{box-shadow:0 0 0 2px var(--g),0 8px 22px rgba(43,33,24,.18)}
.card.dragging{cursor:grabbing;box-shadow:var(--shadow);z-index:5;transition:none}
.card .num{position:absolute;right:-9px;top:-10px;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--page);font-size:12px;font-weight:700;display:none;align-items:center;justify-content:center}
.card.inStory .num{display:flex}
.card.now{animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 2px var(--g),0 0 0 2px var(--g)}100%{box-shadow:0 0 0 2px var(--g),0 0 0 16px transparent}}

/* Floating Inspector Card */
.pop{position:absolute;width:340px;max-height:calc(100% - 24px);display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--g);border-radius:14px;box-shadow:var(--shadow);z-index:20;
  opacity:0;transform:scale(.96);transform-origin:top left;transition:opacity .16s,transform .16s;pointer-events:none;cursor:default;user-select:text}
.pop.open{opacity:1;transform:none;pointer-events:auto}
.pop .ph{display:flex;align-items:flex-start;gap:8px;padding:14px 14px 0}
.pop h2{font-family:var(--mono);font-weight:500;font-size:1.05rem;margin:0;flex:1;overflow-wrap:anywhere}
.pop .x{border:none;background:var(--soft);width:28px;height:28px;border-radius:8px;cursor:pointer;font-size:16px;line-height:1;flex:none}
.pop .tags{display:flex;flex-wrap:wrap;gap:6px;padding:8px 14px 0}
.pop .tags span{font-size:0.76rem;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted)}
.pop .tags span.g{color:var(--g);border-color:var(--g)}
.pop .desc{padding:8px 14px 0;font-size:0.88rem;margin:0}
.pop .why{padding:4px 14px 0;font-size:0.82rem;color:var(--muted);margin:0}
.ptabs{display:flex;gap:4px;padding:12px 14px 0;border-bottom:1px solid var(--soft)}
.ptabs button{border:none;background:none;padding:6px 8px 8px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;font-size:0.86rem;font-weight:500}
.ptabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--g)}
.pbody{overflow:auto;padding:8px 14px 14px}
.crow{display:grid;grid-template-columns:30px 1fr auto;gap:2px 8px;padding:7px 0;border-bottom:1px solid var(--soft);align-items:baseline}
.crow:last-child{border-bottom:none}
.crow code{font-family:var(--mono);font-size:0.82rem}
.crow .ty{color:var(--muted);font-size:0.78rem;white-space:nowrap}
.crow .nt{grid-column:2 / 4;color:var(--muted);font-size:0.78rem}
.crow .go{border:none;background:none;padding:0;color:var(--fk);cursor:pointer;font-size:0.78rem;text-decoration:underline;text-underline-offset:2px}
.k{font-size:11px;font-weight:700;border-radius:4px;padding:1px 4px;text-align:center;align-self:center}
.k.pk{color:var(--pk);background:var(--pk-bg)}
.k.fk{color:var(--fk);background:var(--fk-bg)}
.eg{display:grid;grid-template-columns:auto 1fr;gap:0;font-size:0.8rem;border:1px solid var(--soft);border-radius:10px;overflow:hidden;margin-top:6px}
.eg div{padding:6px 9px;border-bottom:1px solid var(--soft);font-family:var(--mono);overflow-wrap:anywhere}
.eg div:nth-child(odd){color:var(--muted);background:var(--soft)}
.hint{color:var(--muted);font-size:0.8rem;margin:4px 0 0}
.links{display:grid;gap:6px;margin-top:4px}
.links button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;text-align:left;cursor:pointer;font-size:0.84rem}
.links button:hover{border-color:var(--g)}
.links code{font-family:var(--mono);font-size:0.8rem}

/* Overlays inside stage */
.ovl{position:absolute;z-index:15}
.glass{background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}

/* Zoom Controller */
.zoom{top:14px;right:14px;display:flex;flex-direction:column;padding:4px;gap:2px}
.zoom button{width:34px;height:32px;border:none;background:none;border-radius:8px;cursor:pointer;font-size:16px}
.zoom button:hover{background:var(--soft)}
.zoom .pct{font-size:10.5px;color:var(--muted);text-align:center;padding:2px 0}

/* Legend & Shortcuts Overlay (Bottom-Left) */
.keybtn{left:14px;bottom:14px}
.keyhdr{display:flex;align-items:center;justify-content:space-between}
.keyhdr>button{border:none;background:none;padding:8px 12px;cursor:pointer;font-size:0.85rem;font-weight:500;display:inline-flex;align-items:center;gap:7px}
.keyhdr>button:hover{color:var(--focus)}
.keyclose{display:none;border:none;background:var(--soft);width:26px;height:26px;border-radius:7px;cursor:pointer;font-size:14px;line-height:1;margin-right:8px;color:var(--muted);align-items:center;justify-content:center;transition:background .15s,color .15s}
.keyclose:hover{background:var(--line);color:var(--ink)}
.keybtn.open .keyclose{display:inline-flex}
.keybtn.open .keyhdr{border-bottom:1px solid var(--soft)}
.keybody{display:none;padding:8px 14px 12px;font-size:0.82rem;gap:7px;min-width:260px}
.keybtn.open .keybody{display:grid}
.keybody div{display:flex;align-items:center;gap:9px}
.keybody kbd{font-family:var(--mono);font-size:0.74rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--surface)}
.keybody hr{border:none;border-top:1px solid var(--line);margin:4px 0;width:100%}

/* Guided Story Player */
.player{left:50%;bottom:16px;transform:translateX(-50%) translateY(10px);width:min(640px,calc(100% - 100px));min-width:300px;padding:12px 14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.player.open{opacity:1;transform:translateX(-50%);pointer-events:auto}
.player .row{display:flex;align-items:center;gap:8px}
.player h3{margin:0;font-size:0.95rem;flex:1}
.player .cap{margin:6px 0 10px;font-size:0.92rem;min-height:2.8em}
.player .cap code{font-family:var(--mono);font-size:0.84rem;font-weight:500;background:var(--soft);padding:1px 6px;border-radius:5px}
.player .ctl{display:flex;align-items:center;gap:6px}
.player .ctl button{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:5px 12px;cursor:pointer;font-size:0.85rem}
.player .ctl button.pri{background:var(--ink);color:var(--page);border-color:var(--ink)}
.player .ctl button:disabled{opacity:.4;cursor:default}
.dots{display:flex;gap:6px;margin-left:auto}
.dots button{width:10px;height:10px;border-radius:50%;border:none;background:var(--line);padding:0;cursor:pointer}
.dots button.done{background:var(--muted)}
.dots button.cur{background:var(--ink);width:22px;border-radius:5px}
.player .x{border:none;background:none;cursor:pointer;font-size:16px;padding:2px 6px;border-radius:6px}

.toast{left:50%;top:14px;transform:translateX(-50%);padding:7px 14px;font-size:0.85rem;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}

@media (max-width: 820px){
  .top{padding:12px 12px 10px}
  .find input{width:100%}
  .find{flex:1 1 100%}
  .stage{margin:0 10px 10px}
  .player{width:calc(100% - 28px);min-width:0}
  .pop{width:min(340px,calc(100% - 24px))}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>
<div class="top">
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true">
      <rect x="2" y="13" width="20" height="14" rx="4" fill="currentColor"/>
      <rect x="10" y="4" width="18" height="14" rx="4" fill="var(--focus)" stroke="var(--page)" stroke-width="2"/>
    </svg>
    <div>
      <h1 id="hdrTitle">Database Schema</h1>
      <p id="hdrSubtitle">Interactive Entity Relationship Diagram</p>
    </div>
  </div>
  <div class="find">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Find a table or column  ( / )" aria-label="Find a table or column" autocomplete="off" aria-controls="results" aria-expanded="false">
    <div class="results" id="results" role="listbox"></div>
  </div>
  <div class="seg" role="group" aria-label="Attributes shown" id="modes"><span class="lbl">Attributes</span><button data-mode="all" aria-pressed="true">All</button><button data-mode="keys" aria-pressed="false">Keys only</button></div>
  <div class="seg" role="group" aria-label="Focus an area" id="areas"></div>
  <div class="seg" role="group" aria-label="Guided stories" id="storySeg"></div>
  <span class="sp"></span>
  <button class="theme-btn" id="themeBtn" aria-label="Toggle theme" title="Toggle theme">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</div>

<div class="stage" id="stage" aria-label="Entity relationship diagram. Drag to pan, scroll to move, pinch or Ctrl and scroll to zoom.">
  <div class="world" id="world"></div>
  <div class="pop" id="pop" role="dialog" aria-modal="false" aria-labelledby="popTitle"></div>

  <div class="ovl glass zoom" aria-label="Zoom controls">
    <button id="zin" aria-label="Zoom in" title="Zoom in (+)">+</button>
    <div class="pct" id="pct">100%</div>
    <button id="zout" aria-label="Zoom out" title="Zoom out (−)">−</button>
    <button id="zfit" aria-label="Fit to screen" title="Fit to screen (F)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
    <button id="zreset" aria-label="Reset layout" title="Reset layout">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
    </button>
  </div>

  <div class="ovl glass player" id="player"></div>

  <div class="ovl glass keybtn" id="keybox">
    <div class="keyhdr">
      <button id="keytoggle" aria-expanded="false" title="Toggle Legend &amp; Shortcuts">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex:none" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
        Legend &amp; Shortcuts
      </button>
      <button id="keyclose" class="keyclose" aria-label="Close Legend &amp; Shortcuts" title="Close (Esc)">✕</button>
    </div>
    <div class="keybody">
      <div><span class="k pk">PK</span>Primary key, underlined</div>
      <div><span class="k fk">FK</span>Foreign key, in italics</div>
      <div><svg width="44" height="14" aria-hidden="true"><path d="M2 7H42M9 1V13" stroke="var(--edge)" stroke-width="1.7" fill="none"/></svg>1: exactly one</div>
      <div><svg width="44" height="14" aria-hidden="true"><path d="M2 7H42M29 7L42 1M29 7L42 13M29 1V13" stroke="var(--edge)" stroke-width="1.6" fill="none"/></svg>N: many</div>
      <div><svg width="44" height="14" aria-hidden="true"><path d="M2 7H42M35 1V13" stroke="var(--edge)" stroke-width="1.7" fill="none"/></svg>0..1: at most one</div>
      <div>Lines run from a foreign key to the primary key it references</div>
      <hr>

/*******************************************************************************
 * CORE RENDERING & INTERACTION ENGINE
 * The engine dynamically calculates coordinates, auto-arranges domain zones,
 * manages panning, zoom, autocomplete search, cards, connectors, and themes.
 *******************************************************************************/
function colKey(k){
  const pk = /\bPK\b/.test(k);
  const m = k.match(/FK:([\w]+)\.([\w]+)/);
  return { pk, fk: m ? { t: m[1], c: m[2] } : null };
}

function relationsOf(id){
  const out = [];
  for(const e of EDGES){
    if(e[0] === id) out.push({ other: e[1], text: `one <code>${id}</code> ${e[2]} ${e[3] === "one" ? "at most one" : "many"} <code>${e[1]}</code>` });
    if(e[1] === id) out.push({ other: e[0], text: `each <code>${id}</code> belongs to one <code>${e[0]}</code>` });
  }
  const t = byId[id];
  for(const c of t.cols){
    const k = colKey(c[2]);
    if(k.fk && !EDGES.some(e => e[0] === k.fk.t && e[1] === id)){
      out.push({ other: k.fk.t, text: `<code>${c[0]}</code> references <code>${k.fk.t}</code>` });
    }
  }
  return out;
}

const byId = Object.fromEntries(TABLES.map(t => [t.id, t]));
const CARD_W = 300, HEAD = 46, ROWH = 28, PADV = 10, COLGAP = 40, ROWGAP = 28, ZPADT = 54, ZPADX = 22, ZGAP = 36;
let MODE = "all", L = null;

const shown = t => MODE === "all" ? t.cols : t.cols.filter(c => c[2]);
const cardH = id => HEAD + shown(byId[id]).length * ROWH + PADV;

// Dynamic automatic zone and table layout calculation
function computeLayout(){
  const gKeys = Object.keys(GROUPS);
  const zoneCols = gKeys.length <= 2 ? gKeys.length : (gKeys.length === 4 ? 2 : 3);
  
  const zoneDims = {};
  const tablePosInZone = {};

  gKeys.forEach(gKey => {
    const gTables = TABLES.filter(t => t.g === gKey);
    const tCols = gTables.length > 1 ? 2 : 1;
    const zw = ZPADX * 2 + tCols * CARD_W + (tCols - 1) * COLGAP;
    
    const colY = new Array(tCols).fill(ZPADT);
    gTables.forEach((t, i) => {
      const colIdx = i % tCols;
      const x = ZPADX + colIdx * (CARD_W + COLGAP);
      const y = colY[colIdx];
      const h = cardH(t.id);
      tablePosInZone[t.id] = { x, y };
      colY[colIdx] += h + ROWGAP;
    });
    
    const zh = Math.max(160, Math.max(...colY) - ROWGAP + ZPADX);
    zoneDims[gKey] = { w: zw, h: zh };
  });

  const numZoneRows = Math.ceil(gKeys.length / zoneCols);
  const rowHeights = new Array(numZoneRows).fill(0);
  const colWidths = new Array(zoneCols).fill(0);

  gKeys.forEach((gKey, idx) => {
    const c = idx % zoneCols;
    const r = Math.floor(idx / zoneCols);
    colWidths[c] = Math.max(colWidths[c], zoneDims[gKey].w);
    rowHeights[r] = Math.max(rowHeights[r], zoneDims[gKey].h);
  });

  const colX = [24];
  for(let c = 1; c < zoneCols; c++) colX[c] = colX[c - 1] + colWidths[c - 1] + ZGAP;

  const rowY = [24];
  for(let r = 1; r < numZoneRows; r++) rowY[r] = rowY[r - 1] + rowHeights[r - 1] + ZGAP;

  const zones = {};
  const pos = {};

  gKeys.forEach((gKey, idx) => {
    const c = idx % zoneCols;
    const r = Math.floor(idx / zoneCols);
    const zx = colX[c], zy = rowY[r], zw = colWidths[c], zh = rowHeights[r];
    zones[gKey] = [zx, zy, zw, zh];

    const gTables = TABLES.filter(t => t.g === gKey);
    gTables.forEach(t => {
      const p = tablePosInZone[t.id];
      pos[t.id] = { x: zx + p.x, y: zy + p.y };
    });
  });

  const totalW = colX[zoneCols - 1] + colWidths[zoneCols - 1] + 48;
  const totalH = rowY[numZoneRows - 1] + rowHeights[numZoneRows - 1] + 48;
  L = { zones, pos, CW: Math.max(1200, totalW), CH: Math.max(760, totalH) };
}

const home = () => JSON.parse(JSON.stringify(L.pos));
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const v = n => n.startsWith("--") ? `var(${n})` : n.startsWith("var(") ? n : n;
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

computeLayout();

const S = { sel: null, hover: null, group: null, q: "", story: null, step: 0, timer: null, tab: "about", pos: home(), cam: { x: 0, y: 0, k: 1 } };
const stage = $("#stage"), world = $("#world"), pop = $("#pop");
const cardEl = id => world.querySelector(`.card[data-id="${id}"]`);

function entityHTML(t){
  const storeInfo = STORES[t.s] || { short: (t.s || "DB").toUpperCase(), label: t.s || "Database" };
  const rows = shown(t).map(c => {
    const k = colKey(c[2]);
    const cls = [k.pk ? "pk" : "", k.fk ? "fk" : ""].join(" ").trim();
    const b = k.pk ? '<span class="k pk">PK</span>' : k.fk ? '<span class="k fk">FK</span>' : '<span></span>';
    const typeObj = TYPES[c[1]] || [c[1], c[1]];
    return `<li class="${cls}" data-col="${c[0]}"${k.fk ? ` data-ref="${k.fk.t}"` : ""}>${b}<span class="cn">${esc(c[0])}</span><span class="ct">${esc(typeObj[0])}</span></li>`;
  }).join("");
  return `<div class="hd"><span class="nm">${t.id}</span><span class="st" title="${esc(storeInfo.label)}">${esc(storeInfo.short)}</span></div><ul>${rows}</ul><span class="num"></span>`;
}

function build(){
  world.style.width = L.CW + "px";
  world.style.height = L.CH + "px";
  let h = "";
  for(const [g, [x, y, w, hh]] of Object.entries(L.zones)){
    const grp = GROUPS[g] || { label: g, c: "--c-1", t: "--t-1" };
    h += `<div class="zone" data-group="${g}" style="left:${x}px;top:${y}px;width:${w}px;height:${hh}px;--z:${v(grp.t)};--zc:${v(grp.c)}"><b>${esc(grp.label)}</b></div>`;
  }
  h += `<svg class="edges" id="edges" width="${L.CW}" height="${L.CH}" aria-hidden="true"></svg>`;
  for(const t of TABLES){
    const p = S.pos[t.id];
    const grp = GROUPS[t.g] || { c: "--c-1" };
    h += `<div class="card" role="button" tabindex="0" data-id="${t.id}" aria-label="${t.id} entity, ${t.cols.length} attributes" style="left:${p.x}px;top:${p.y}px;height:${cardH(t.id)}px;--g:${v(grp.c)}">${entityHTML(t)}</div>`;
  }
  world.innerHTML = h;
  world.querySelectorAll(".card").forEach(bindCard);

  renderAreaButtons();
  renderStoryButtons();
  drawEdges();
}

function renderAreaButtons(){
  const areas = $("#areas");

  if(gKeys.length <= 1){ areas.style.display = "none"; return; }

    const grp = GROUPS[k];

    return `<button data-group="${k}" aria-pressed="false" style="--g:${v(grp.c)}"><i></i>${esc(shortLabel)}</button>`;
  }).join("");
  areas.querySelectorAll("button").forEach(b => {
    b.onclick = () => {
      S.group = S.group === b.dataset.group ? null : b.dataset.group;
      closeStory();
      S.sel = null;
      pop.classList.remove("open");
      apply();
    };

}

function renderStoryButtons(){
  const storySeg = $("#storySeg");
  const storyKeys = Object.keys(STORIES || {});
  if(!storyKeys.length){ storySeg.style.display = "none"; return; }
  storySeg.style.display = "inline-flex";
  storySeg.innerHTML = `<span class="lbl">Stories</span>` + storyKeys.map(k => {
    const label = STORIES[k].title.replace(/^Follow (an?|the) /i, "");
    return `<button data-story="${k}" aria-pressed="false">${esc(label)}</button>`;
  }).join("");

    b.onclick = () => S.story === b.dataset.story ? closeStory() : openStory(b.dataset.story);
  });
}

function setMode(m){
  if(MODE === m) return;
  MODE = m;
  computeLayout();
  S.pos = home();
  build();
  document.querySelectorAll("[data-mode]").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === MODE ? "true" : "false"));
  flyTo(startCam());
  placePop();
}
document.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => setMode(b.dataset.mode));

function rect(id){ const p = S.pos[id]; return { l: p.x, t: p.y, w: CARD_W, h: cardH(id) }; }
function rowY(id, col){ const i = shown(byId[id]).findIndex(c => c[0] === col); const r = rect(id); return i < 0 ? r.t + r.h / 2 : r.t + HEAD + 5 + i * ROWH + ROWH / 2; }
function fkCol(pa, ch){ const c = byId[ch].cols.find(c => { const k = colKey(c[2]); return k.fk && k.fk.t === pa; }); return c ? { fk: c[0], pk: colKey(c[2]).fk.c } : null; }

function geom(pa, ch){
  const a = rect(pa), b = rect(ch), acx = a.l + a.w / 2, acy = a.t + a.h / 2, bcx = b.l + b.w / 2, bcy = b.t + b.h / 2;
  const sep = (b.l > a.l + a.w) || (a.l > b.l + b.w);
  const horiz = (sep && Math.abs(bcx - acx) >= Math.abs(bcy - acy) * 0.6);
  const fc = fkCol(pa, ch);
  let P;
  if(horiz){
    const ay = fc ? rowY(pa, fc.pk) : acy, by = fc ? rowY(ch, fc.fk) : bcy;
    const sx = bcx > acx ? a.l + a.w : a.l, ex = bcx > acx ? b.l : b.l + b.w, dx = (ex - sx) / 2;
    P = [[sx, ay], [sx + dx, ay], [ex - dx, by], [ex, by]];
  } else {
    const sy = bcy > acy ? a.t + a.h : a.t, ey = bcy > acy ? b.t : b.t + b.h, dy = (ey - sy) / 2;
    P = [[acx, sy], [acx, sy + dy], [bcx, ey - dy], [bcx, ey]];
  }
  const mid = [(P[0][0] + 3*P[1][0] + 3*P[2][0] + P[3][0]) / 8, (P[0][1] + 3*P[1][1] + 3*P[2][1] + P[3][1]) / 8];
  const lab = (p, q) => {
    let ux = q[0] - p[0], uy = q[1] - p[1];
    const n = Math.hypot(ux, uy) || 1;
    ux /= n; uy /= n;
    return [p[0] + ux * 12 - uy * 17, p[1] + uy * 12 + ux * 17];
  };
  return { d: `M ${P[0][0]} ${P[0][1]} C ${P[1][0]} ${P[1][1]}, ${P[2][0]} ${P[2][1]}, ${P[3][0]} ${P[3][1]}`, mid, na: lab(P[0], P[1]), nb: lab(P[3], P[2]) };
}

const MK = (id, col, d, o) => `<marker id="${id}" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="${o}"><path d="${d}" style="stroke:var(${col})" stroke-width="1.7" fill="none"/></marker>`;
const ONE = "M9 1V13", MANY = "M2 7L13 1M2 7L13 7M2 7L13 13M2 1V13";

function drawEdges(){
  let o = `<defs>${MK("one","--edge",ONE,"auto-start-reverse")}${MK("many","--edge",MANY,"auto")}${MK("oneH","--ink",ONE,"auto-start-reverse")}${MK("manyH","--ink",MANY,"auto")}</defs>`;
  for(const [pa, ch, verb, end] of EDGES){
    const { d, mid, na, nb } = geom(pa, ch), w = verb.length * 7.4 + 18;
    o += `<g class="edge" data-a="${pa}" data-b="${ch}" data-end="${end || 'many'}"><title>${esc(`${pa} ${verb} ${end === "one" ? "at most one" : "many"} ${ch}`)}</title>
      <path class="hit" d="${d}"/><path class="ln" d="${d}" marker-start="url(#one)" marker-end="url(#${end || 'many'})"/>
      <text class="card-n" x="${na[0]}" y="${na[1]}" text-anchor="middle" dominant-baseline="central">1</text>
      <text class="card-n" x="${nb[0]}" y="${nb[1]}" text-anchor="middle" dominant-baseline="central">${end === "one" ? "0..1" : "N"}</text>
      <g class="tag"><rect x="${mid[0] - w/2}" y="${mid[1] - 12}" width="${w}" height="24" rx="12"/><text x="${mid[0]}" y="${mid[1]}" text-anchor="middle" dominant-baseline="central">${esc(verb)}</text></g></g>`;
  }
  const svg = $("#edges");
  svg.innerHTML = o;
  svg.querySelectorAll(".edge").forEach(g => g.addEventListener("click", ev => {
    ev.stopPropagation();
    const t = S.sel === g.dataset.b ? g.dataset.a : g.dataset.b;
    closeStory();
    openTable(t, true);
  }));
  apply();
}

let raf = 0;
const redraw = () => { if(raf) return; raf = requestAnimationFrame(() => { raf = 0; drawEdges(); placePop(); }); };

function matches(t, q){
  q = q.toLowerCase();
  return t.id.includes(q) || t.cols.some(c => c[0].includes(q) || (c[3] || "").toLowerCase().includes(q)) || t.purpose.toLowerCase().includes(q);
}

function focusSet(){
  if(S.story){
    const ids = STORIES[S.story].steps.map(s => s[0]);
    const set = new Set(ids);
    return { set, on: (a, b) => set.has(a) && set.has(b), hl: false };
  }
  const f = S.sel || S.hover;
  if(f){
    const set = new Set([f]);
    EDGES.forEach(e => { if(e[0] === f) set.add(e[1]); if(e[1] === f) set.add(e[0]); });
    return { set, on: (a, b) => a === f || b === f, hl: true };
  }
  let set = null;
  if(S.group) set = new Set(TABLES.filter(t => t.g === S.group).map(t => t.id));
  else if(S.q) set = new Set(TABLES.filter(t => matches(t, S.q)).map(t => t.id));
  return set ? { set, on: (a, b) => set.has(a) && set.has(b), hl: false } : null;
}

function apply(){
  const F = focusSet(), steps = S.story ? STORIES[S.story].steps.map(s => s[0]) : [];
  world.querySelectorAll(".card").forEach(el => {
    const id = el.dataset.id, idx = steps.indexOf(id);
    el.classList.toggle("dim", !!F && !F.set.has(id));
    el.classList.toggle("sel", S.sel === id);
    el.classList.toggle("inStory", idx >= 0);
    el.classList.toggle("now", !!S.story && idx === S.step);
    el.querySelector(".num").textContent = idx >= 0 ? idx + 1 : "";
  });
  world.querySelectorAll(".zone").forEach(z => z.classList.toggle("dim", !!S.group && z.dataset.group !== S.group));
  const pairs = [];
  if(S.story) for(let i = 1; i <= S.step; i++) pairs.push([steps[i-1], steps[i]]);
  document.querySelectorAll(".edge").forEach(g => {
    const a = g.dataset.a, b = g.dataset.b, on = F ? F.on(a, b) : true;
    const pr = pairs.find(([x, y]) => (x === a && y === b) || (x === b && y === a));
    const hl = (!!F && F.hl && on) || !!pr;
    g.classList.toggle("dim", !!F && !on);
    g.classList.toggle("hl", hl);
    g.classList.toggle("rev", !!pr && pr[0] === b);
    const p = g.querySelector(".ln"), H_ = hl ? "H" : "";
    p.setAttribute("marker-start", `url(#one${H_})`);
    p.setAttribute("marker-end", `url(#${g.dataset.end || 'many'}${H_})`);
  });
  document.querySelectorAll("[data-story]").forEach(b => b.setAttribute("aria-pressed", b.dataset.story === S.story ? "true" : "false"));
  $("#areas").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b.dataset.group === S.group ? "true" : "false"));
}

function applyCam(){
  const { x, y, k } = S.cam;
  world.style.transform = `translate(${x}px,${y}px) scale(${k})`;
  $("#pct").textContent = Math.round(k * 100) + "%";
  placePop();
}

const clampK = k => Math.max(0.2, Math.min(2.2, k));
function zoomAt(k, sx, sy){
  const c = S.cam; k = clampK(k);
  const wx = (sx - c.x) / c.k, wy = (sy - c.y) / c.k;
  S.cam = { x: sx - wx * k, y: sy - wy * k, k };
  applyCam();
}

function fitCam(){
  const W = stage.clientWidth, H = stage.clientHeight;
  const k = clampK(Math.min((W - 60) / L.CW, (H - 60) / L.CH, 1.05));
  return { x: (W - L.CW * k) / 2, y: (H - L.CH * k) / 2, k };
}

function startCam(){
  const firstZone = Object.values(L.zones)[0];
  if(!firstZone) return fitCam();
  const W = stage.clientWidth;
  const k = clampK(Math.min(0.85, (W - 80) / firstZone[2]));
  return { x: 30 - firstZone[0] * k, y: 30 - firstZone[1] * k, k };
}

let anim = 0;
function flyTo(t){
  cancelAnimationFrame(anim);
  if(reduced){ S.cam = t; applyCam(); return; }
  const f = { ...S.cam }, t0 = performance.now(), D = 460;
  const step = now => {
    const p = Math.min(1, (now - t0) / D), e = 1 - Math.pow(1 - p, 3);
    S.cam = { x: f.x + (t.x - f.x) * e, y: f.y + (t.y - f.y) * e, k: f.k + (t.k - f.k) * e };
    applyCam();
    if(p < 1) anim = requestAnimationFrame(step);
  };
  anim = requestAnimationFrame(step);
}

function centerOn(id, { k, shift = 0 } = {}){
  const W = stage.clientWidth, H = stage.clientHeight, p = S.pos[id];
  k = clampK(k ?? Math.max(S.cam.k, 0.85));
  flyTo({ x: W / 2 - (p.x + CARD_W / 2) * k - shift, y: H / 2 - (p.y + Math.min(cardH(id), H / k - 60) / 2) * k, k });
}

function openTable(id, fly){
  S.sel = id; S.hover = null; S.tab = "about";
  renderPop();
  apply();
  if(fly) centerOn(id, { shift: stage.clientWidth > 820 ? 160 : 0 });
}

function closeTable(){ S.sel = null; pop.classList.remove("open"); apply(); }

function renderPop(){
  const t = byId[S.sel];
  if(!t){ pop.classList.remove("open"); return; }
  const grp = GROUPS[t.g] || { label: t.g, c: "--c-1" };
  const storeInfo = STORES[t.s] || { label: t.s || "Database" };
  pop.style.setProperty("--g", v(grp.c));

  const tabs = [
    ["about", "About"],
    ["cols", `Attributes (${t.cols.length})`],
    ["eg", "Example row"],
    ["links", `Relationships (${relationsOf(t.id).length})`]
  ];

  let body = "";
  if(S.tab === "about"){
    body = `<p class="desc" style="padding:4px 0 0">${esc(t.purpose)}</p>
      <p class="why" style="padding:6px 0 0">${esc(t.used)}</p>
      <p class="hint" style="margin-top:10px">Stored in ${esc(storeInfo.label)}. Primary key: ${t.cols.filter(c => colKey(c[2]).pk).map(c => c[0]).join(", ") || "None"}.</p>`;
  } else if(S.tab === "cols"){
    body = t.cols.map(c => {
      const k = colKey(c[2]);
      const badge = k.pk ? '<span class="k pk">PK</span>' : k.fk ? '<span class="k fk">FK</span>' : '<span></span>';
      const note = [c[3] ? esc(c[3]) : "", k.fk ? `<button class="go" data-go="${k.fk.t}">Open ${k.fk.t}</button>` : ""].filter(Boolean).join(" ");
      const typeObj = TYPES[c[1]] || [c[1], c[1]];
      return `<div class="crow">${badge}<code>${esc(c[0])}</code><span class="ty">${esc(typeObj[0])}</span>${note ? `<span class="nt">${note}</span>` : ""}</div>`;
    }).join("");
  } else if(S.tab === "eg"){
    const s = SAMPLE[t.id] || {};
    body = Object.keys(s).length
      ? `<p class="hint">Illustrative mock record data.</p><div class="eg">${t.cols.filter(c => s[c[0]] !== undefined).map(c => `<div>${esc(c[0])}</div><div>${esc(s[c[0]])}</div>`).join("")}</div>`
      : `<p class="hint">No sample record provided for this table.</p>`;
  } else {
    const r = relationsOf(t.id);
    body = r.length ? `<div class="links">${r.map(x => `<button data-go="${x.other}">${x.text}</button>`).join("")}</div>` : `<p class="hint">No direct foreign key links.</p>`;
  }

  pop.innerHTML = `<div class="ph"><h2 id="popTitle">${esc(t.id)}</h2><button class="x" aria-label="Close" id="popx">×</button></div>
    <div class="tags"><span class="g">${esc(grp.label)}</span><span>${esc(storeInfo.label)}</span></div>
    <div class="ptabs" role="tablist">${tabs.map(([k, l]) => `<button role="tab" data-tab="${k}" aria-selected="${S.tab === k}">${l}</button>`).join("")}</div>
    <div class="pbody">${body}</div>`;

  pop.querySelector("#popx").onclick = closeTable;
  pop.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { S.tab = b.dataset.tab; renderPop(); });
  pop.querySelectorAll("[data-go]").forEach(b => b.onclick = () => openTable(b.dataset.go, true));
  pop.classList.add("open");
  placePop();
}

function placePop(){
  if(!S.sel || !pop.classList.contains("open")) return;
  const { x, y, k } = S.cam, p = S.pos[S.sel], W = stage.clientWidth, H = stage.clientHeight, pw = pop.offsetWidth, ph = pop.offsetHeight;
  const cl = x + p.x * k, ct = y + p.y * k, cw = CARD_W * k;
  let left = cl + cw + 14;
  if(left + pw > W - 12) left = cl - pw - 14;
  if(left < 12) left = Math.max(12, Math.min(W - pw - 12, cl));
  let top = ct - 8;
  top = Math.max(12, Math.min(H - ph - 12, top));
  pop.style.left = left + "px";
  pop.style.top = top + "px";
}

function openStory(key){
  stopPlay(); S.story = key; S.step = 0; S.sel = null; S.group = null; pop.classList.remove("open");
  renderPlayer(); apply(); centerOn(STORIES[key].steps[0][0], { k: Math.max(S.cam.k, 0.95) });
}
function closeStory(){ if(!S.story) return; stopPlay(); S.story = null; $("#player").classList.remove("open"); apply(); }
function goStep(i){
  const n = STORIES[S.story].steps.length; S.step = Math.max(0, Math.min(n - 1, i));
  renderPlayer(); apply(); centerOn(STORIES[S.story].steps[S.step][0]);
}
function startPlay(){
  const n = STORIES[S.story].steps.length; if(S.step >= n - 1) S.step = 0;
  S.timer = setInterval(() => { if(S.step >= STORIES[S.story].steps.length - 1){ stopPlay(); renderPlayer(); return; } goStep(S.step + 1); }, 2800);
  goStep(S.step);
}
function stopPlay(){ if(S.timer){ clearInterval(S.timer); S.timer = null; } }

function renderPlayer(){
  const s = STORIES[S.story], n = s.steps.length, i = S.step, [id, txt] = s.steps[i], el = $("#player");
  el.innerHTML = `<div class="row"><h3>${esc(s.title)}</h3><button class="x" id="pclose" aria-label="Close story">×</button></div>
    <p class="cap"><code>${esc(id)}</code> ${esc(txt)}</p>
    <div class="ctl">
      <button id="pprev" ${i === 0 ? "disabled" : ""}>Previous</button>
      <button id="pplay" class="pri">${S.timer ? "Pause" : i === n - 1 ? "Replay" : "Play"}</button>
      <button id="pnext" ${i === n - 1 ? "disabled" : ""}>Next</button>
      <div class="dots">${s.steps.map((st, k) => `<button data-k="${k}" class="${k === i ? "cur" : k < i ? "done" : ""}" aria-label="Step ${k + 1}: ${st[0]}"></button>`).join("")}</div>
    </div>`;
  el.classList.add("open");
  $("#pclose").onclick = closeStory;
  $("#pprev").onclick = () => { stopPlay(); goStep(i - 1); };
  $("#pnext").onclick = () => { stopPlay(); goStep(i + 1); };
  $("#pplay").onclick = () => { if(S.timer){ stopPlay(); renderPlayer(); } else startPlay(); };
  el.querySelectorAll("[data-k]").forEach(b => b.onclick = () => { stopPlay(); goStep(+b.dataset.k); });
}

function bindCard(el){
  const id = el.dataset.id; let st = null, moved = false;
  el.addEventListener("pointerdown", ev => {
    if(ev.button !== 0) return;
    ev.stopPropagation();
    st = { x: ev.clientX, y: ev.clientY, ox: S.pos[id].x, oy: S.pos[id].y };
    moved = false;
    el.setPointerCapture(ev.pointerId);
  });
  el.addEventListener("pointermove", ev => {
    if(!st) return;
    const dx = (ev.clientX - st.x) / S.cam.k, dy = (ev.clientY - st.y) / S.cam.k;
    if(!moved && Math.hypot(dx, dy) < 4) return;
    moved = true;
    el.classList.add("dragging");
    const nx = Math.max(0, Math.min(L.CW - CARD_W, st.ox + dx)), ny = Math.max(0, Math.min(L.CH - cardH(id), st.oy + dy));
    S.pos[id] = { x: nx, y: ny };
    el.style.left = nx + "px";
    el.style.top = ny + "px";
    redraw();
  });
  el.addEventListener("pointerup", () => {
    if(!st) return; const was = moved; st = null; moved = false; el.classList.remove("dragging");
    if(!was){
      if(S.story){
        const idx = STORIES[S.story].steps.findIndex(s => s[0] === id);
        if(idx >= 0){ stopPlay(); goStep(idx); return; }
        closeStory();
      }
      openTable(id, false);
    }
  });
  el.addEventListener("pointercancel", () => { st = null; moved = false; el.classList.remove("dragging"); });
  el.addEventListener("mouseenter", () => { if(st || S.sel || S.story) return; S.hover = id; apply(); });
  el.addEventListener("mouseleave", () => { if(S.hover === id){ S.hover = null; apply(); } });
  el.addEventListener("keydown", ev => { if(ev.key === "Enter" || ev.key === " "){ ev.preventDefault(); closeStory(); openTable(id, true); } });
  el.addEventListener("mouseover", ev => {
    const li = ev.target.closest("li[data-ref]"); if(!li) return;
    const ref = li.dataset.ref, pkc = colKey(byId[id].cols.find(c => c[0] === li.dataset.col)[2]).fk.c;
    li.classList.add("lit");
    const tgt = cardEl(ref);
    tgt && tgt.querySelector(`li[data-col="${pkc}"]`)?.classList.add("lit");
    document.querySelector(`.edge[data-a="${ref}"][data-b="${id}"]`)?.classList.add("hl");
  });
  el.addEventListener("mouseout", ev => {
    const li = ev.target.closest("li[data-ref]"); if(!li) return;
    document.querySelectorAll(".card li.lit").forEach(x => x.classList.remove("lit"));
    apply();
  });
}

// Stage Canvas Interaction
const ptrs = new Map(); let pan = null, pinch = null, bgMoved = false;
stage.addEventListener("pointerdown", ev => {
  if(ev.target.closest(".card,.pop,.ovl,.edge")) return;
  ptrs.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
  stage.setPointerCapture(ev.pointerId);
  bgMoved = false;
  cancelAnimationFrame(anim);
  if(ptrs.size === 1){ pan = { x: ev.clientX, y: ev.clientY, cx: S.cam.x, cy: S.cam.y }; stage.classList.add("panning"); }
  if(ptrs.size === 2){
    const [a, b] = [...ptrs.values()]; const r = stage.getBoundingClientRect();
    pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), k: S.cam.k, mx: (a.x + b.x) / 2 - r.left, my: (a.y + b.y) / 2 - r.top };
    pan = null;
  }
});
stage.addEventListener("pointermove", ev => {
  if(!ptrs.has(ev.pointerId)) return;
  ptrs.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
  if(pinch && ptrs.size === 2){
    const [a, b] = [...ptrs.values()];
    zoomAt(pinch.k * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d, pinch.mx, pinch.my);
    bgMoved = true;
    return;
  }
  if(pan){
    const dx = ev.clientX - pan.x, dy = ev.clientY - pan.y;
    if(Math.hypot(dx, dy) > 3) bgMoved = true;
    S.cam = { ...S.cam, x: pan.cx + dx, y: pan.cy + dy };
    applyCam();
  }
});
const endPtr = ev => {
  if(!ptrs.has(ev.pointerId)) return;
  ptrs.delete(ev.pointerId);
  if(ptrs.size < 2) pinch = null;
  if(ptrs.size === 0){
    if(pan && !bgMoved){ if(S.sel) closeTable(); }
    pan = null;
    stage.classList.remove("panning");
  }
};
stage.addEventListener("pointerup", endPtr);
stage.addEventListener("pointercancel", endPtr);
stage.addEventListener("wheel", ev => {
  if(ev.target.closest(".pop,.results")) return;
  ev.preventDefault(); cancelAnimationFrame(anim);
  const r = stage.getBoundingClientRect();
  if(ev.ctrlKey || ev.metaKey) zoomAt(S.cam.k * Math.exp(-ev.deltaY * 0.003), ev.clientX - r.left, ev.clientY - r.top);
  else { S.cam = { ...S.cam, x: S.cam.x - ev.deltaX, y: S.cam.y - ev.deltaY }; applyCam(); }
}, { passive: false });

const cz = f => zoomAt(S.cam.k * f, stage.clientWidth / 2, stage.clientHeight / 2);
$("#zin").onclick = () => cz(1.2);
$("#zout").onclick = () => cz(1 / 1.2);
$("#zfit").onclick = () => flyTo(fitCam());
$("#zreset").onclick = () => {
  S.pos = home();
  world.querySelectorAll(".card").forEach(el => {
    const p = S.pos[el.dataset.id]; el.style.left = p.x + "px"; el.style.top = p.y + "px";
  });
  drawEdges(); placePop(); flyTo(startCam()); toast("Layout reset");
};

// Bottom-Left Legend & Shortcuts Handlers
const keybox = $("#keybox"), keytoggle = $("#keytoggle"), keyclose = $("#keyclose");
function closeKeybox(){
  keybox.classList.remove("open");
  keytoggle.setAttribute("aria-expanded", "false");
}
function toggleKeybox(){
  const o = !keybox.classList.contains("open");
  keybox.classList.toggle("open", o);
  keytoggle.setAttribute("aria-expanded", o);
}
keytoggle.onclick = toggleKeybox;
keyclose.onclick = closeKeybox;
document.addEventListener("pointerdown", ev => {
  if(keybox.classList.contains("open") && !ev.target.closest("#keybox")){
    closeKeybox();
  }
});

// Autocomplete Search
const q = $("#q"), res = $("#results"); let hits = [], act = 0;
function searchHits(s){
  s = s.toLowerCase(); const out = [];
  for(const t of TABLES){
    const grp = GROUPS[t.g] || { label: t.g };
    if(t.id.includes(s)) out.push({ id: t.id, label: t.id, sub: grp.label });
  }
  for(const t of TABLES) for(const c of t.cols){
    if(c[0].includes(s) && !t.id.includes(s)) out.push({ id: t.id, label: `${t.id}.${c[0]}`, sub: "column" });
  }
  return out.slice(0, 8);
}
function renderResults(){
  if(!S.q){ res.classList.remove("open"); q.setAttribute("aria-expanded", "false"); return; }
  res.innerHTML = hits.length
    ? hits.map((h, i) => {
        const grp = GROUPS[byId[h.id].g] || { c: "--c-1" };
        return `<button role="option" data-i="${i}" class="${i === act ? "act" : ""}" style="--g:${v(grp.c)}"><i></i><b>${esc(h.label)}</b><small>${esc(h.sub)}</small></button>`;
      }).join("")
    : `<div class="none">No table or column matches “${esc(S.q)}”.</div>`;
  res.classList.add("open"); q.setAttribute("aria-expanded", "true");
  res.querySelectorAll("button").forEach(b => b.onmousedown = e => { e.preventDefault(); pick(+b.dataset.i); });
}
function pick(i){ const h = hits[i]; if(!h) return; closeStory(); S.q = ""; q.value = ""; renderResults(); openTable(h.id, true); q.blur(); }

q.addEventListener("input", () => { S.q = q.value.trim(); hits = S.q ? searchHits(S.q) : []; act = 0; S.sel = null; pop.classList.remove("open"); closeStory(); apply(); renderResults(); });
q.addEventListener("keydown", e => {
  if(e.key === "ArrowDown"){ e.preventDefault(); act = Math.min(hits.length - 1, act + 1); renderResults(); }
  else if(e.key === "ArrowUp"){ e.preventDefault(); act = Math.max(0, act - 1); renderResults(); }
  else if(e.key === "Enter"){ e.preventDefault(); pick(act); }
  else if(e.key === "Escape"){ q.value = ""; S.q = ""; hits = []; renderResults(); apply(); q.blur(); }
});
q.addEventListener("blur", () => setTimeout(() => res.classList.remove("open"), 120));

function toast(m){ const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("show"), 1400); }

// Keyboard Shortcuts
document.addEventListener("keydown", e => {
  const typing = e.target && e.target.matches && e.target.matches("input");
  if(typing) return;
  if(e.key === "/"){ e.preventDefault(); q.focus(); }
  else if(e.key === "Escape"){
    if(keybox.classList.contains("open")) closeKeybox();
    else if(S.sel) closeTable();
    else if(S.story) closeStory();
    else if(S.group){ S.group = null; apply(); }
  }
  else if(e.key === "f" || e.key === "F") flyTo(fitCam());
  else if(e.key === "+" || e.key === "=") cz(1.2);
  else if(e.key === "-") cz(1 / 1.2);
  else if(S.story && e.key === "ArrowRight"){ e.preventDefault(); stopPlay(); goStep(S.step + 1); }
  else if(S.story && e.key === "ArrowLeft"){ e.preventDefault(); stopPlay(); goStep(S.step - 1); }
});

// Theme Switcher
$("#themeBtn").onclick = () => {
  const cur = document.documentElement.dataset.theme;
  const nxt = cur === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = nxt;
  try { localStorage.setItem("schema-theme", nxt); } catch(e){}
  toast(nxt === "dark" ? "Dark theme active" : "Light theme active");
};
try {
  const t = localStorage.getItem("schema-theme") || CONFIG.defaultTheme;
  if(t) document.documentElement.dataset.theme = t;
} catch(e){}

// Initialize Page Headers from CONFIG
if(CONFIG.title) {
  document.title = CONFIG.title;
  $("#hdrTitle").textContent = CONFIG.title;
}
if(CONFIG.subtitle) {
  $("#hdrSubtitle").textContent = CONFIG.subtitle;
}

let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { placePop(); }, 100); });

build();
S.cam = startCam();
applyCam();
if(document.fonts && document.fonts.ready) document.fonts.ready.then(() => { placePop(); });
</script>
